<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F0E" />
    <title>Finova — Offline</title>
    <style>
      *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0B0F0E;
        background-image: radial-gradient(900px 420px at 80% -10%, rgba(52,211,153,.10), transparent 60%);
        color: #E9EFEC; text-align: center; padding: 24px;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .wrap { max-width: 340px; }
      .badge {
        width: 72px; height: 72px; border-radius: 20px; display: block; margin: 0 auto 14px;
        box-shadow: 0 16px 38px -14px rgba(52, 211, 153, 0.55);
      }
      .brand {
        font-size: 15px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 18px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: #9DB3AB; font-size: 13.5px; line-height: 1.65; margin: 0 0 22px; }
      button {
        background: #34D399; color: #04150E; border: 0; border-radius: 12px;
        padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
        min-height: 44px; font-family: inherit;
      }
      button:active { transform: scale(.97); }
      .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#FB7185; margin-right:7px; }
      small { display:block; margin-top:18px; color:#68807A; font-size:11px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="badge" src="./icons/icon-192.png" width="72" height="72" alt="Finova" />
      <div class="brand">Finova</div>
      <h1>You're offline</h1>
      <p><span class="dot"></span>Finova couldn't reach the network. Your cached dashboard is still available — reconnect to sync the latest.</p>
      <button onclick="location.reload()">Try again</button>
      <small>All your data is stored locally on this device.</small>
    </div>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
